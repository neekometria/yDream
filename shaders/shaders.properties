// Distant Horizons programs do not inherit the gbuffers bindings: gaux2 and
// noisetex have to be bound for each DH program that samples them. Without
// these lines the cloud-noise lookup in DH water reads a colour buffer and the
// cloud occlusion test never triggers.
texture.dh_water.noisetex = textures/water_256_RG_8bit.png
texture.dh_water.gaux2 = textures/clouds_natural_512_R_8bit.png
texture.dh_terrain.noisetex = textures/water_256_RG_8bit.png
texture.dh_terrain.gaux2 = textures/clouds_natural_512_R_8bit.png
