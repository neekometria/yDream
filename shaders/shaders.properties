texture.composite.smaaAreaTex = textures/smaa_area.png
texture.composite.smaaSearchTex = textures/smaa_search.png
texture.composite4.smaaAreaTex = textures/smaa_area.png
texture.composite4.smaaSearchTex = textures/smaa_search.png
texture.composite5.smaaAreaTex = textures/smaa_area.png
texture.composite5.smaaSearchTex = textures/smaa_search.png

// colortex3 is written by composite2 through DRAWBUFFERS:13.
// Iris automatically flips render targets written by a composite pass.
// No manual flip is needed here.

// SMAA runs on composite4 (edge detection) and composite5 (blending weights).
// The neighbourhood blend itself happens in final, where colortex1 is only
// read, never written. `program.*.enabled` only accepts bare option names, so
// the mode test has to go through the properties preprocessor.
#if AA_MODE == 4 || AA_MODE == 5
program.composite4.enabled = true
program.composite5.enabled = true
#else
// Without SMAA these passes would only waste two full-screen draws.
program.composite4.enabled = false
program.composite5.enabled = false
#endif

