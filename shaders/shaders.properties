uniform.float.pixelSizeX = 1.0 / viewWidth
uniform.float.pixelSizeY = 1.0 / viewHeight
uniform.float.aspectRatioInverse = 1.0 / aspectRatio

variable.float.hour_world = worldTime * 0.001
uniform.float.dayMoment = hour_world * 0.04166666666666667

variable.float.sky_day_frac = frac(worldTime / 24000.0 - 0.25)

variable.float.sky_angle = (sky_day_frac * 2.0 + 0.5 - cos(sky_day_frac * 3.141592653589793) * 0.5) / 3.0
variable.float.sunElevationRaw = sin(6.283185307179586 * (sky_angle + 0.25))

variable.float.moment_aux = dayMoment - 0.25
variable.float.moment_aux_2 = moment_aux * moment_aux
variable.float.dayMixerRaw = clamp(-moment_aux_2 * 20.0 + 1.25, 0.0, 1.0)

variable.float.moment_aux_3 = dayMoment - 0.75
variable.float.moment_aux_4 = moment_aux_3 * moment_aux_3
variable.float.nightMixerRaw = clamp(-moment_aux_4 * 50.0 + 3.125, 0.0, 1.0)

variable.float.moment_aux_5 = (dayMoment * 4.0) - 1.0
variable.float.moment_aux_6 = moment_aux_5 * moment_aux_5 * moment_aux_5 * moment_aux_5
variable.float.day_vol_mixer = clamp(((-moment_aux_6 + 1.0) * 7.0) + 1.0, 1.0, 8.0)

variable.float.moment_aux_7 = (dayMoment * 4.0) - 3.0
variable.float.moment_aux_8 = moment_aux_7 * moment_aux_7 * moment_aux_7 * moment_aux_7
variable.float.night_vol_mixer = clamp(((-moment_aux_8 + 1.0) * 7.0) + 1.0, 1.0, 8.0)

variable.float.volumetricDayMixerRaw = max(day_vol_mixer, night_vol_mixer)

variable.float.light_mix_a = if((worldTime >= 0 && worldTime < 12485) || worldTime >= 23515, 1.0, 0.0)
variable.float.light_mix_b = if(worldTime >= 12485 && worldTime < 13085, 1.0 - ((worldTime - 12485) * 0.0016666666666666668), 0.0)
variable.float.light_mix_c = 0.0
variable.float.light_mix_d = if(worldTime >= 22915 && worldTime < 23515, (worldTime - 22915) * 0.0016666666666666668, 0.0)
variable.float.light_mix_e = max(light_mix_a, light_mix_b)
variable.float.light_mix_f = max(light_mix_c, light_mix_d)
variable.float.dayNightMixRaw = max(light_mix_e, light_mix_f)
variable.float.nightSelectRaw = if(dayMoment >= 0.5, 1.0, 0.0)

uniform.float.dayNightMix = dayNightMixRaw

#if TIME_TRANSITION == 1
uniform.float.sunElevation = smooth(21, sunElevationRaw, TIME_TRANSITION_DURATION, TIME_TRANSITION_DURATION)
uniform.float.dayMixer = smooth(22, dayMixerRaw, TIME_TRANSITION_DURATION, TIME_TRANSITION_DURATION)
uniform.float.nightMixer = smooth(23, nightMixerRaw, TIME_TRANSITION_DURATION, TIME_TRANSITION_DURATION)
uniform.float.volumetricDayMixer = smooth(24, volumetricDayMixerRaw, TIME_TRANSITION_DURATION, TIME_TRANSITION_DURATION)
uniform.float.nightSelect = smooth(26, nightSelectRaw, TIME_TRANSITION_DURATION, TIME_TRANSITION_DURATION)
#else
uniform.float.sunElevation = sunElevationRaw
uniform.float.dayMixer = dayMixerRaw
uniform.float.nightMixer = nightMixerRaw
uniform.float.volumetricDayMixer = volumetricDayMixerRaw
uniform.float.nightSelect = nightSelectRaw
#endif

uniform.float.auroraBiomeFade = smooth(27, if(biome_precipitation == 2, 1.0, 0.0), 9.0, 5.0)

// =====================================================================
// TAA / SMAA T2x - custom uniforms (Iris / OptiFine shaders.properties)
//
// PRE-REQUISITO: pixelSizeX = 1.0 / viewWidth e pixelSizeY = 1.0 / viewHeight
// precisam estar declarados ANTES deste bloco (uniforms customizados so podem
// referenciar uniforms/variaveis declarados acima deles).
//
// CONVENCAO DE UNIDADES (vale para todo o arquivo):
//   - As tabelas estao em PIXELS, no intervalo [-0.5, +0.5].
//   - NDC mede 2 unidades de borda a borda da tela, logo 1 pixel = 2 * pixelSize
//     em NDC. Por isso pixel -> NDC e "* 2.0 * pixelSize".
//   - No vertex shader o offset deve ser aplicado multiplicado por w:
//       gl_Position.xy += taaOffset * gl_Position.w;
//     (sem o "* w" o deslocamento varia com a profundidade apos a divisao
//     perspectiva e deixa de ser um jitter subpixel uniforme).
// =====================================================================

// Indice de 16 fases para ruido/efeitos. Inalterado.
// O frameCounter do Iris volta a 0 em 720720, que e divisivel por 16,
// entao a sequencia continua sem salto no wrap.
uniform.int.frameMod = fmod(frameCounter, 16)

// Nao relacionado ao TAA. Mantido exatamente como estava.
uniform.float.letterboxAmount = smooth(if(is_sneaking, 1.0, 0.0), 4, 4)

// Fase atual do jitter (0..7). 720720 % 8 == 0, sem descontinuidade no wrap.
uniform.int.frameTaaMod = fmod(frameCounter, 8)

// Fase do frame ANTERIOR, calculada a partir da atual: (n - 1) mod 8.
// Usa "+ 7" em vez de "- 1" para nunca passar argumento negativo ao fmod.
// No wrap: frame 720719 tem fase 7 e o frame 0 calcula prev = 7, consistente.
// Declarado como "variable" porque so e usado aqui (nao precisa ir para a GPU).
variable.int.frameTaaModPrev = fmod(frameCounter + 7, 8)

// Deslocamento temporal R1 (razao aurea) para dithering e ruido animado.
// Nao tem periodo 8 nem 16, entao nao fica travado em fase com o jitter.
// O fmod(..., 1024) antes da multiplicacao preserva a precisao do float
// (frameCounter * 0.618 chegaria a ~445000 e perderia as casas decimais).
// Uso no GLSL: noise = fract(blueNoise + frameR1);
uniform.float.frameR1 = frac(fmod(frameCounter, 1024) * 0.6180339887)

// Os "||" sao obrigatorios. Sem eles a expressao do preprocessador e invalida.
#if AA_MODE == 1 || AA_MODE == 2 || AA_MODE == 3

// --- TAA / ATAA: 8 amostras, cobertura de pixel inteiro -----------------
// X: centros dos 8 estratos de 1/8 de pixel, em ordem van der Corput base 2:
//    (bitrev3(k) + 0.5) / 8 - 0.5  ->  media exatamente 0.
// Y: Halton base 3, indices 1..8, menos 0.5 -> media 0 e exatamente um
//    ponto em cada estrato de 1/8 de pixel.
// Pares (X,Y): 2 pontos por quadrante; os frames 0 e 1 ficam em quadrantes
// diagonalmente opostos; os 4 primeiros cobrem os 4 quadrantes.
// Escala 2.0 = pegada do pixel inteiro (S = 1.0). Para imagem mais nitida
// com menos antialiasing, troque 2.0 por 1.5 (S = 0.75) nas QUATRO linhas
// de escala abaixo (taaOffset e taaOffsetPrevious precisam ser iguais).
uniform.vec2.taaOffset = vec2((if( \
frameTaaMod == 0, -0.4375, \
frameTaaMod == 1, 0.0625, \
frameTaaMod == 2, -0.1875, \
frameTaaMod == 3, 0.3125, \
frameTaaMod == 4, -0.3125, \
frameTaaMod == 5, 0.1875, \
frameTaaMod == 6, -0.0625, \
frameTaaMod == 7, 0.4375, \
0.0)) * 0.25 * pixelSizeX, \
(if( \
frameTaaMod == 0, -0.1666667, \
frameTaaMod == 1, 0.1666667, \
frameTaaMod == 2, -0.3888889, \
frameTaaMod == 3, -0.0555556, \
frameTaaMod == 4, 0.2777778, \
frameTaaMod == 5, -0.2777778, \
frameTaaMod == 6, 0.0555556, \
frameTaaMod == 7, 0.3888889, \
0.0)) * 0.25 * pixelSizeY)

// Offset do frame anterior: MESMAS tabelas, MESMA escala, MESMO sinal,
// apenas indexadas por frameTaaModPrev. Assim taaOffsetPrevious(n) e,
// por construcao, identico a taaOffset(n-1) e nao pode dessincronizar.
uniform.vec2.taaOffsetPrevious = vec2((if( \
frameTaaModPrev == 0, -0.4375, \
frameTaaModPrev == 1, 0.0625, \
frameTaaModPrev == 2, -0.1875, \
frameTaaModPrev == 3, 0.3125, \
frameTaaModPrev == 4, -0.3125, \
frameTaaModPrev == 5, 0.1875, \
frameTaaModPrev == 6, -0.0625, \
frameTaaModPrev == 7, 0.4375, \
0.0)) * 0.25 * pixelSizeX, \
(if( \
frameTaaModPrev == 0, -0.1666667, \
frameTaaModPrev == 1, 0.1666667, \
frameTaaModPrev == 2, -0.3888889, \
frameTaaModPrev == 3, -0.0555556, \
frameTaaModPrev == 4, 0.2777778, \
frameTaaModPrev == 5, -0.2777778, \
frameTaaModPrev == 6, 0.0555556, \
frameTaaModPrev == 7, 0.3888889, \
0.0)) * 0.25 * pixelSizeY)

#elif AA_MODE == 5

// --- SMAA T2x: 2 fases de +-0.25 px -------------------------------------
// 0.25 px * 2.0 * pixelSize = 0.5 * pixelSize em NDC (amplitude ja correta).
// A paridade do frame aqui deve casar com a escolha de subsampleIndices
// no passe do SMAA (fase par <-> um conjunto, fase impar <-> o outro).
uniform.vec2.taaOffset = vec2((if( \
fmod(frameCounter, 2) == 0, 0.5, \
-0.5)) * pixelSizeX, \
(if( \
fmod(frameCounter, 2) == 0, -0.5, \
0.5)) * pixelSizeY)

// Frame anterior de um frame par e impar, e vice-versa.
// Correcao: X do frame par era -0.1; o valor do frame impar e -0.5.
uniform.vec2.taaOffsetPrevious = vec2((if( \
fmod(frameCounter, 2) == 0, -0.5, \
0.5)) * pixelSizeX, \
(if( \
fmod(frameCounter, 2) == 0, 0.5, \
-0.5)) * pixelSizeY)

#else

// Sem AA temporal: nenhum jitter.
uniform.vec2.taaOffset = vec2(0.0, 0.0)
uniform.vec2.taaOffsetPrevious = vec2(0.0, 0.0)

#endif


#if AA_MODE == 2 || AA_MODE == 3 || AA_MODE == 5
uniform.float.ditherShift = if( \
        frameMod == 0, 0.0625, \
        frameMod == 1, 0.4375, \
        frameMod == 2, 0.875, \
        frameMod == 3, 0.625, \
        frameMod == 4, 0.25, \
        frameMod == 5, 0.8125, \
        frameMod == 6, 0.125, \
        frameMod == 7, 0.9375, \
        frameMod == 8, 0.3125, \
        frameMod == 9, 0.5, \
        frameMod == 10, 0.375, \
        frameMod == 11, 0.5625, \
        frameMod == 12, 0.75, \
        frameMod == 13, 0.6875, \
        frameMod == 14, 0.1875, \
        frameMod == 15, 0.0, \
        0.0)
#else
uniform.float.ditherShift = 0.0
#endif

uniform.float.fovYInverse = 1.0 / atan(1.0 / gbufferProjection.1.1) * 0.5

